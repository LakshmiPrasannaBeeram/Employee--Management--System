
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Employee</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Navigation */
        nav {
            background-color: #302b63;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Form Container */
        .container {
            width: 500px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #302b63;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* Buttons */
        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-size: 16px;
        }

        .submit-btn {
            background-color: green;
        }

        .reset-btn {
            background-color: #777;
        }

        button:hover {
            opacity: 0.85;
        }

    </style>

</head>

<body>


    <!-- Navigation -->

    <nav>

        <a href="/home">Home</a>

        <a href="/employees">Employees</a>

        <a href="/addemployee">Add Employee</a>

        <a href="/search">Search</a>

        <a href="/login">Login</a>

        <a href="/register">Register</a>

    </nav>


    <!-- Form -->

    <div class="container">

        {% if employee %}

        <h1>Edit Employee</h1>

        <form method="POST"
              action="{{ url_for('add_employee', employee_id=employee.id) }}">

        {% else %}

        <h1>Add Employee</h1>

        <form method="POST"
              action="/addemployee">

        {% endif %}


            <!-- Name -->

            <label>Employee Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter employee name"
                value="{{ employee.name if employee else '' }}"
                required
            >


            <!-- Department -->

            <label>Department</label>

            <input
                type="text"
                name="department"
                placeholder="Enter department"
                value="{{ employee.department if employee else '' }}"
                required
            >


            <!-- Position -->

            <label>Position</label>

            <input
                type="text"
                name="position"
                placeholder="Enter position"
                value="{{ employee.position if employee else '' }}"
                required
            >


            <!-- Email -->

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                value="{{ employee.email if employee else '' }}"
                required
            >


            <!-- Phone -->

            <label>Phone</label>

            <input
                type="tel"
                name="phone"
                placeholder="Enter phone number"
                value="{{ employee.phone if employee else '' }}"
                required
            >


            <!-- Salary -->

            <label>Salary</label>

            <input
                type="number"
                name="salary"
                placeholder="Enter salary"
                value="{{ employee.salary if employee else '' }}"
                required
            >


            <!-- Buttons -->

            <div class="buttons">

                <button
                    type="submit"
                    class="submit-btn">
                    {% if employee %}
                        Update Employee
                    {% else %}
                        Add Employee
                    {% endif %}
                </button>


                <button
                    type="reset"
                    class="reset-btn">
                    Reset
                </button>

            </div>


        </form>

    </div>

</body>

</html>
